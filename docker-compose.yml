version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: agilis-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: agilis
      POSTGRES_PASSWORD: agilis123
      POSTGRES_DB: agilis_db
    ports:
      - '5432:5432'
    volumes:
      - agilis-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U agilis -d agilis_db']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: agilis-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - agilis-redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: agilis-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://agilis:agilis123@postgres:5432/agilis_db?schema=public
      JWT_SECRET: ${JWT_SECRET:?Defina JWT_SECRET no .env}
      JWT_EXPIRES_IN: 7d
      NODE_ENV: production
      PORT: 3000
      API_PREFIX: api/v1
      CORS_ORIGIN: http://localhost:4200
      REDIS_HOST: redis
      REDIS_PORT: 6379
      MAIL_PROVIDER: resend
      RESEND_API_KEY: ${RESEND_API_KEY:?Defina RESEND_API_KEY no .env}
      MAIL_FROM: Agilis <onboarding@resend.dev>
      SELAH_IA_BASE_URL: ${SELAH_IA_BASE_URL:-}
      SELAH_IA_API_KEY: ${SELAH_IA_API_KEY:-}
      SELAH_IA_SOURCE_APP: AgilisBack
      SELAH_IA_TIMEOUT_MS: ${SELAH_IA_TIMEOUT_MS:-30000}
    ports:
      - '3000:3000'
    volumes:
      - ./backend:/app
      - /app/node_modules

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: agilis-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - '4200:80'

volumes:
  agilis-postgres-data:
  agilis-redis-data:
