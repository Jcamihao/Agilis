<div class="flex flex-col gap-6 max-w-3xl">

  <!-- Header -->
  <div class="flex items-center gap-3">
    <a [routerLink]="['/projects', projectId(), 'kanban']"
      class="p-1.5 rounded-lg hover:bg-slate-100 text-[--text-tertiary] transition-colors">
      <span class="material-symbols-rounded text-xl">arrow_back</span>
    </a>
    <div>
      <h2 class="text-xl font-bold text-[--text-primary] flex items-center gap-2">
        <span class="material-symbols-rounded text-xl text-primary-600">settings</span>
        Configurações do Projeto
      </h2>
      @if (project()) {
        <p class="text-sm text-[--text-secondary]">{{ project()!.name }}</p>
      }
    </div>
  </div>

  <!-- ── Custom Fields ──────────────────────────────────────────────────────── -->
  @if (projectId()) {
    <div class="bg-[rgb(var(--c-surface))] rounded-xl border border-[rgb(var(--c-border) / 0.07)] shadow-sm p-6">
      <p class="text-sm text-[--text-secondary] mb-5">
        Campos personalizados aparecem em todas as tarefas deste projeto.
      </p>
      <ag-custom-fields-manager [projectId]="projectId()" />
    </div>
  }
</div>
