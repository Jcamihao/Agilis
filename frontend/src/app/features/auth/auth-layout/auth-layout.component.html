<div class="flex flex-1 w-full h-screen" style="background: rgb(var(--c-canvas));">

  <!-- Left Panel: Video hero + trust signals (lg+) -->
  <div class="hidden lg:flex flex-col flex-1 relative overflow-hidden justify-between p-10"
       style="background: rgb(var(--c-canvas)); border-right: 1px solid rgb(var(--c-border) / 0.12);">

    <!-- Background video (mouse/touch scrub) -->
    <video
      #heroVideo
      class="absolute inset-0 w-full h-full object-cover"
      style="object-position: 65% center;"
      src="/vids/hero_vid.mp4"
      muted
      playsinline
      preload="auto"
    ></video>
    <!-- Legibility scrim so text stays readable over any video frame -->
    <div class="absolute inset-0"
         style="background: linear-gradient(180deg, rgb(var(--c-canvas) / 0.1), rgb(var(--c-canvas) / 0.55) 65%, rgb(var(--c-canvas) / 0.8));"></div>

    <!-- Logo -->
    <div class="relative z-10 flex items-center gap-3">
      <div class="w-9 h-9 flex items-center justify-center" style="border: 1px solid rgb(var(--c-border) / 0.25); background: rgb(var(--c-canvas) / 0.6); backdrop-filter: blur(8px);">
        <span class="material-symbols-rounded text-lg" style="color: rgb(var(--c-text));">space_dashboard</span>
      </div>
      <span class="font-medium text-xl tracking-[-0.02em]" style="color: rgb(var(--c-text));">
        AGILIS <span class="ag-glyph ag-glyph--spin" style="color: rgb(var(--c-border) / 0.5);">✳︎</span>
      </span>
    </div>

    <!-- Hero: typewriter greeting -->
    <div class="relative z-10 flex flex-col gap-6 max-w-lg mb-20">
      <p class="text-[26px] font-medium leading-[1.3] tracking-[-0.02em] p-5"
         style="color: rgb(var(--c-text)); background: rgb(var(--c-border) / 0.04); border: 1px solid rgb(var(--c-border) / 0.12); backdrop-filter: blur(12px); min-height: 128px;">
        <span>{{ typedText() }}</span><span
          class="inline-block w-[2px] h-[1em] align-middle ml-[2px]"
          [class.animate-blink]="showCursor()"
          [class.opacity-0]="!showCursor()"
          style="background: rgb(var(--c-text));"></span>
      </p>

      <!-- Stats -->
      <div class="flex items-center gap-6 pt-4 border-t"
           style="border-color: rgb(var(--c-border) / 0.12);">
        <div class="flex flex-col gap-1">
          <span class="text-[20px] font-medium leading-tight" style="color: rgb(var(--c-text));">SSL/TLS</span>
          <span class="text-[11px] font-medium uppercase tracking-[0.08em]"
                style="color: rgb(var(--c-500));">Conexão Criptografada</span>
        </div>
      </div>
    </div>

    <!-- Testimonial -->
    <div class="relative z-10 flex items-center gap-4 p-4 w-max"
         style="background: rgb(var(--c-border) / 0.04);
                border: 1px solid rgb(var(--c-border) / 0.12);
                backdrop-filter: blur(12px);">
      <div class="w-10 h-10 rounded-full flex items-center justify-center font-medium text-sm flex-shrink-0"
           style="background: rgb(var(--p-200)); color: rgb(var(--c-text)); border: 1px solid rgb(var(--c-border) / 0.15);">AB</div>
      <div>
        <p class="text-[14px]" style="color: rgb(var(--c-text));">"A interface mais limpa que já usamos."</p>
        <p class="text-[12px] font-medium" style="color: rgb(var(--c-500));">Ana Costa, CTO TechNova</p>
      </div>
    </div>
  </div>

  <!-- Right Panel: Form -->
  <div class="flex-1 flex flex-col justify-center items-center p-6 lg:p-10 relative"
       style="background: rgb(var(--c-canvas));">

    <!-- Mobile logo -->
    <div class="lg:hidden flex items-center gap-3 absolute top-6 left-6">
      <div class="w-8 h-8 flex items-center justify-center" style="border: 1px solid rgb(var(--c-border) / 0.25);">
        <span class="material-symbols-rounded" style="font-size: 16px; color: rgb(var(--c-text));">space_dashboard</span>
      </div>
      <span class="font-medium text-lg" style="color: rgb(var(--c-text));">AGILIS</span>
    </div>

    <div class="w-full max-w-[400px]">
      <router-outlet />
    </div>
  </div>

</div>
