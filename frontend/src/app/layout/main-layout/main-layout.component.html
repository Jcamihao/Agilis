    <div class="h-screen overflow-hidden" style="background: #f9fafb;">
      <!-- Sidebar (fixed) -->
      <ag-sidebar [collapsed]="sidebarCollapsed()" (toggleCollapse)="toggleSidebar()" />

      <!-- Main Content — block element, margin-left accounts for fixed sidebar width -->
      <div class="flex flex-col h-screen transition-all duration-300 ease-smooth"
           [style.margin-left]="sidebarCollapsed() ? '68px' : '248px'">

        <!-- Topbar -->
        <ag-topbar (menuToggle)="toggleSidebar()" />

        <!-- Page Content -->
        <main class="flex-1 overflow-y-auto">
          <div class="p-6 animate-fade-in-up">
            <router-outlet />
          </div>
        </main>
      </div>
    </div>
